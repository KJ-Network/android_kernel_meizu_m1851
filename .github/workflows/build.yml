name: Build Kernel M1851
on:
  workflow_dispatch:
  push:

jobs:
  build:
    name: Build Kernel M1851 by ${{ github.actor }}
    runs-on: ubuntu-22.04
    steps:

      - name: Set Beijing timezone
        uses: szenius/set-timezone@v1.2
        with:
          timezoneLinux: "Asia/Shanghai"

      - name: Set SWAP to 5GiB
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 5

      - name: Initialize compilation environment
        run: |
          sudo apt-get update
          sudo apt-get install git automake build-essential bc python2 -y
          sudo rm /bin/python
          sudo ln /bin/python2 /bin/python
          echo "BUILD_TIME=$(TZ=Asia/Shanghai date "+%Y%m%d%H%M")" >> $GITHUB_ENV
          
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Get Toolchain
        run: |
          git clone -q https://gitlab.com/ThankYouMario/android_prebuilts_clang-standalone.git -b 12 --depth 1 toolchain/clang
          git clone -q https://github.com/KJ-Network/gcc-linaro-5.5.0-2017.10-x86_64_aarch64-linux-gnu.git --depth 1 toolchain/gcc

      - name: Build Kernel
        run: |
          export KBUILD_BUILD_HOST=Github-Action
          export KBUILD_BUILD_USER=$(echo ${{ github.actor }} | tr A-Z a-z)
          export ARCH="arm64"
          export SUBARCH="arm64"
          export PATH="$GITHUB_WORKSPACE/toolchain/clang/bin:$GITHUB_WORKSPACE/toolchain/gcc/bin:$PATH"
          export CC="clang"
          export CROSS_COMPILE="aarch64-linux-gnu-"
          make O=out m1851_defconfig
          make -j$(nproc --all) O=out

      - name: Pack Kernel
        run: |
          cp out/arch/arm64/boot/Image.gz-dtb android/Installer
          
      - name: Upload Kernel Package
        uses: actions/upload-artifact@v4
        with:
          name: Kernel_M1851_Installer_${{ env.BUILD_TIME }}
          path: android/Installer/*
          
